<nav
  class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-6 pt-2 bg-white/80 backdrop-blur-xl border-t border-surface-dim/20 shadow-[0_-8px_30px_rgba(0,0,0,0.04)]"
>
  <div class="flex items-center justify-around max-w-md mx-auto">
    @for (tab of tabs(); track tab.route) {
      <a
        [routerLink]="tab.route"
        class="flex flex-col items-center justify-center gap-1 px-5 py-2 rounded-2xl transition-all duration-200"
        [class.bg-secondary-container]="isActive(tab.route)"
        [class.scale-105]="isActive(tab.route)"
      >
        <ion-icon
          [icon]="isActive(tab.route) ? tab.activeIcon : tab.icon"
          class="text-[22px]"
          [style.color]="
            isActive(tab.route)
              ? 'var(--color-primary)'
              : 'var(--color-neutral)'
          "
        >
        </ion-icon>

        <span
          class="text-[11px] font-semibold"
          [style.color]="
            isActive(tab.route)
              ? 'var(--color-primary)'
              : 'var(--color-neutral)'
          "
        >
          {{ tab.label }}
        </span>
      </a>
    }
  </div>
</nav>
