@if (ready()) {
<google-map
  class="block h-full w-full overflow-hidden rounded-3xl"
  height="100%"
  width="100%"
  [center]="center"
  [zoom]="zoom"
  [options]="mapOptions"
  (mapClick)="onMapClick($event)"
>
  <map-marker
    [position]="markerPosition"
    [options]="markerOptions"
    (mapDragend)="onMarkerDragEnd($event)"
  />
</google-map>
} @else {
<div
  class="grid h-full w-full place-items-center rounded-3xl bg-gradient-to-br from-sky-100 via-surface-dim/70 to-emerald-100"
>
  <div class="flex flex-col items-center gap-2 px-4 text-center">
    <div
      class="grid h-14 w-14 place-items-center rounded-full bg-primary text-white shadow-lg"
    >
      <ion-icon [icon]="locationIcon" class="text-2xl"></ion-icon>
    </div>
    @if (!hasApiKey) {
    <span class="text-xs font-semibold text-neutral/60">
      Falta configurar la API key de Google Maps (ver
      doc/geolocalizacion-mapas.md)
    </span>
    } @else if (loadError()) {
    <span class="text-xs font-semibold text-neutral/60"
      >No se pudo cargar el mapa</span
    >
    } @else {
    <span class="text-xs font-semibold text-neutral/60">Cargando mapa…</span>
    }
  </div>
</div>
}
