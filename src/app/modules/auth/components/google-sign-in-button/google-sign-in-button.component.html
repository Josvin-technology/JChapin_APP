<button
  type="button"
  (click)="signIn()"
  [disabled]="disabled || loading()"
  class="w-full h-14 bg-white flex items-center justify-center gap-3 border border-surface-dim/70 !rounded-md hover:bg-surface-dim/10 transition-all disabled:opacity-60 disabled:cursor-not-allowed"
>
  @if (loading()) {
  <ion-spinner name="crescent" class="w-5 h-5"></ion-spinner>
  <span>Conectando con Google...</span>
  } @else {
  <img src="assets/icon/google-logo.svg" alt="Google" class="w-5 h-5" />
  <span>{{ label }}</span>
  }
</button>
