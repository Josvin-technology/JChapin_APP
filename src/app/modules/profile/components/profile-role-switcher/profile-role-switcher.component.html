<section
  class="!rounded-[1.35rem] border border-surface-dim/70 bg-white p-3 shadow-sm"
>
  <p
    class="px-1 text-[10px] font-semibold uppercase tracking-wide text-neutral/70"
  >
    Vista de demostracion - Cambiar rol
  </p>

  <div class="mt-2 grid grid-cols-3 gap-2">
    @for (role of roles; track role.value) {
      <button
        type="button"
        class="min-h-12 !rounded-[1.15rem] px-2 text-[11px] font-semibold leading-tight text-neutral transition"
        [class.bg-primary]="selectedRole === role.value"
        [class.text-white]="selectedRole === role.value"
        [class.shadow-sm]="selectedRole === role.value"
        [class.bg-primary/10]="selectedRole !== role.value"
        (click)="selectRole(role.value)"
      >
        {{ role.label }}
      </button>
    }
  </div>
</section>
