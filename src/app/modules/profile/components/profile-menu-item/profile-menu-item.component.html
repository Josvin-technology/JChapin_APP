<a
  class="flex min-h-[4rem] items-center gap-4 rounded-[1.15rem] border border-surface-dim/70 bg-white px-4 shadow-sm transition active:scale-[0.99]"
  [class.text-error]="item.danger"
  [routerLink]="item.action ? null : item.route || null"
  (click)="item.action?.()"
>
  <span
    class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-white"
    [class.bg-primary]="!item.danger"
    [class.bg-error]="item.danger"
    [class.bg-opacity-10]="true"
  >
    <ion-icon [name]="item.icon" class="text-xl"></ion-icon>
  </span>

  <span class="min-w-0 flex-1 text-sm font-semibold text-neutral">
    {{ item.label }}
  </span>

  @if (item.badge) {
    <span
      class="grid h-7 min-w-7 place-items-center rounded-full bg-surface px-2 text-xs font-bold text-neutral"
    >
      {{ item.badge }}
    </span>
  }

  @if (!item.danger) {
    <ion-icon
      name="chevron-forward-outline"
      class="text-lg text-neutral/45"
    ></ion-icon>
  }
</a>
