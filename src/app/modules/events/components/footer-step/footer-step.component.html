<footer
  class="fixed inset-x-0 bottom-[calc(6rem+env(safe-area-inset-bottom,0px))] z-40 grid grid-cols-2 gap-[0.55rem] w-[min(100%-2rem,26rem)] mx-auto border border-[#d3dbe3]/78 rounded-[1.45rem] bg-white/92 p-2 shadow-[0_0.85rem_2rem_rgba(29,37,43,0.12)] backdrop-blur-md"
>
  <button
    class="inline-flex min-w-0 h-[3.05rem] items-center justify-center gap-[0.45rem] border-solid border-gray-400 !rounded-[1.15rem] bg-white text-gray-700 font-extrabold text-[0.9rem] transition-all duration-150 ease-in-out active:scale-95 disabled:opacity-45"
    type="button"
    (click)="back.emit()"
    [disabled]="step === 1"
  >
    <ion-icon name="chevron-back-outline"></ion-icon>
    Atrás
  </button>

  <button
    class="inline-flex min-w-0 h-[3.05rem] items-center justify-center gap-[0.45rem] !rounded-[1.15rem] bg-primary text-white font-extrabold text-[0.9rem] transition-all duration-150 ease-in-out active:scale-95 disabled:opacity-45"
    type="button"
    (click)="next.emit()"
  >
    {{ loading ? "Publicando..." : endStep ? "Publicar evento" : "Continuar" }}
    @if (!endStep && !loading) {
      <ion-icon name="chevron-forward-outline"></ion-icon>
    }
  </button>
</footer>
