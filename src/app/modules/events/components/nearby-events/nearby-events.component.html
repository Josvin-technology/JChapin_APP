@if (events().length) {
<section class="flex flex-col gap-3">
  <div class="flex items-center gap-1.5">
    <ion-icon [icon]="navigateIcon" class="text-xl text-primary"></ion-icon>
    <h2 class="text-lg font-bold text-neutral">Eventos cerca de ti</h2>
  </div>

  <div class="flex gap-3 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">
    @for (event of events(); track event.id) {
    <a
      [routerLink]="['/events', event.id]"
      class="flex-shrink-0 w-56 rounded-2xl overflow-hidden shadow-sm relative block active:scale-[0.98] transition-transform"
    >
      <img
        [src]="event.image"
        [alt]="event.title"
        class="w-full h-36 object-cover"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/65 via-black/10 to-transparent"
      ></div>

      <div
        class="absolute top-2.5 left-2.5 bg-white rounded-xl px-2.5 py-1 text-center min-w-[44px] shadow-sm"
      >
        <p class="text-[9px] font-bold text-neutral/60 uppercase leading-none">
          {{ event.month }}
        </p>
        <p class="text-xl font-black text-neutral leading-none">
          {{ event.day }}
        </p>
      </div>

      <div class="absolute bottom-0 left-0 right-0 p-3">
        <p class="text-white font-bold text-sm leading-tight line-clamp-1">
          {{ event.title }}
        </p>
        <p class="text-white/70 text-[11px] mt-0.5 flex items-center gap-1">
          <ion-icon [icon]="navigateIcon" class="text-xs"></ion-icon>
          {{ event.location }}
        </p>
      </div>
    </a>
    }
  </div>
</section>
}
