<div class="fixed inset-x-0 bottom-[86px] z-40 px-5">
  <div
    class="mx-auto flex max-w-md items-center gap-4 rounded-3xl border border-surface-dim/70 bg-white/95 p-3 shadow-[0_-10px_34px_rgba(0,0,0,0.08)] backdrop-blur"
  >
    <div class="min-w-0 flex-1">
      <p class="text-xs text-neutral/55">Precio</p>
      <p class="truncate text-xl font-black leading-tight text-neutral">
        {{ event.price }}
      </p>
    </div>
    @if (canReserve()) {
      <button
        (click)="reserveTicket()"
        [disabled]="reserving()"
        class="flex h-14 flex-[1.7] items-center justify-center gap-2 !rounded-full bg-primary px-4 text-sm font-black text-white"
      >
        <ion-icon [icon]="ticketIcon" class="text-lg"></ion-icon>
        {{ reserving() ? "Reservando…" : "Reservar ahora" }}
      </button>
    } @else {
      <p class="flex-[1.7] text-center text-md font-semibold">
        <a routerLink="/login" class="text-primary font-bold">Inicia sesión</a>
        para reservar
      </p>
    }
  </div>
</div>
