<ion-content [fullscreen]="true" [scrollY]="true">
  @if(event){
  <main
    class="mx-auto flex min-h-full w-full max-w-md flex-col gap-7 bg-surface px-4 animate-fade-in"
    style="padding-bottom: calc(11rem + env(safe-area-inset-bottom, 0px))"
  >
    <app-event-detail-hero [event]="event" />

    <app-event-info-stack [event]="event" />

    <section>
      <h2 class="mb-2 text-lg font-black text-neutral">Acerca del evento</h2>
      <p class="text-sm leading-7 text-neutral/70">{{ event.description }}</p>
    </section>

    <app-event-location-traffic [event]="event" />

    <app-event-reviews [event]="event" />
  </main>

  <app-reservation-bar [event]="event" />

  }
</ion-content>
