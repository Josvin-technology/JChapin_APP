<ion-content [fullscreen]="false" [scrollY]="true">
  <main
    class="w-full max-w-md mx-auto px-4 flex flex-col gap-8 animate-fade-in"
    style="
      padding-top: calc(4rem + env(safe-area-inset-top, 0px) + 1.5rem);
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px) + 1rem);
    "
  >
    <!-- Hero / Search -->
    <app-hero-search />

    <!-- Categorías -->
     <app-category-list />

    <!-- Próximos Eventos -->
     <app-event-list/>
  </main>
</ion-content>
