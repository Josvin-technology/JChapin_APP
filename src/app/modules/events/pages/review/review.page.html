<ion-content [fullscreen]="true" [scrollY]="true">
  @if(event){
  <main
    class="mx-auto flex min-h-full w-full max-w-md flex-col gap-6 bg-surface px-5 pt-8 animate-fade-in"
    style="padding-bottom: calc(8rem + env(safe-area-inset-bottom, 0px))"
  >
    <header class="flex items-center gap-4 border-b border-surface-dim/50 pb-5">
      <button
        type="button"
        (click)="goBack()"
        class="grid h-11 w-11 shrink-0 place-items-center !rounded-full bg-white text-neutral shadow-sm"
      >
        <ion-icon [icon]="backIcon" class="text-2xl"></ion-icon>
      </button>
      <div>
        <h1 class="text-2xl font-black leading-tight text-neutral">
          Tu opinion
        </h1>
        <p class="text-sm text-neutral/60">Ayudanos a mejorar</p>
      </div>
    </header>

    <article
      class="overflow-hidden !rounded-3xl border border-surface-dim/70 bg-white shadow-sm"
    >
      <img
        [src]="event.image"
        [alt]="event.title"
        class="h-36 w-full object-cover"
      />
      <div class="p-4">
        <p class="text-xs font-semibold uppercase text-neutral/60">Evento</p>
        <h2 class="mt-1 text-base font-black text-neutral">
          {{ event.title }}
        </h2>
      </div>
    </article>

    <section
      class="rounded-3xl border border-surface-dim/70 bg-white p-6 text-center shadow-sm"
    >
      <h2 class="mb-5 text-base font-black text-neutral">
        Como calificarias el evento?
      </h2>
      <div class="flex justify-center gap-4 text-4xl text-amber-400">
        @for (value of [1, 2, 3, 4, 5]; track value) {
        <button type="button" (click)="rating = value" class="leading-none">
          <ion-icon
            [icon]="value <= rating ? starIcon : starOutlineIcon"
          ></ion-icon>
        </button>
        }
      </div>
    </section>

    <section
      class="rounded-3xl border border-surface-dim/70 bg-white p-5 shadow-sm"
    >
      <h2 class="mb-4 text-base font-black text-neutral">Lo recomendarias?</h2>
      <div class="grid grid-cols-3 gap-2">
        @for (option of ['Si', 'Tal vez', 'No']; track option) {
        <button
          type="button"
          (click)="recommendation = option"
          class="h-11 !rounded-full border text-sm font-semibold transition"
          [class.border-primary]="recommendation === option"
          [class.bg-primary]="recommendation === option"
          [class.text-white]="recommendation === option"
          [class.border-surface-dim]="recommendation !== option"
          [class.text-neutral]="recommendation !== option"
        >
          {{ option }}
        </button>
        }
      </div>
    </section>

    <label class="flex flex-col gap-2">
      <span class="text-base font-black text-neutral">Comentarios</span>
      <textarea
        [(ngModel)]="comment"
        rows="4"
        placeholder="Cuentanos que te parecio..."
        class="min-h-28 resize-none rounded-3xl border border-surface-dim bg-white p-4 text-sm text-neutral shadow-sm outline-none focus:border-primary"
      ></textarea>
    </label>

    <button
      type="button"
      (click)="submitReview()"
      [disabled]="submitting()"
      class="h-14 !rounded-full bg-primary text-sm font-black text-white shadow-sm"
    >
      {{ submitting() ? 'Enviando...': 'Enviar reseña'}}
    </button>
  </main>
  }
</ion-content>
